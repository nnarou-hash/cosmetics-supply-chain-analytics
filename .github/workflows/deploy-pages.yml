name: Déployer le dashboard sur GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/cosmetics_supply_chain_dashboard.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp dashboard/cosmetics_supply_chain_dashboard.html _site/index.html
          touch _site/.nojekyll

      - name: Téléverser le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
